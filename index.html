<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RB eSports Casino</title>
    <!-- Скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Стили -->
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Встроенные стили на случай, если внешний файл не загрузится */
        body { margin: 0; background: #0a0a0a; color: white; font-family: sans-serif; }
        .app-container { display: flex; flex-direction: column; width: 100%; max-width: 450px; margin: 0 auto; }
        .banner { width: 100%; height: auto; display: block; border-bottom: 2px solid red; }
        .balance-card { margin: 15px; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; display: flex; justify-content: space-between; font-size: 18px; }
        .balance-value { color: #ffcc00; font-weight: bold; }
        .tabs { display: flex; margin: 0 15px 15px 15px; gap: 5px; }
        .tab-btn { flex: 1; padding: 10px; background: #222; border: none; color: #888; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #ff0000; color: white; }
        .tab-content { display: none; padding: 0 15px; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }
        .roulette-window { width: 150px; height: 150px; border: 3px solid red; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 60px; margin: 20px 0; background: black; box-shadow: 0 0 20px red; }
        .colors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px; }
        .color-btn { padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; color: white; cursor: pointer; }
        .yellow { background: #d4af37; color: black; }
        .green { background: #32cd32; }
        .blue { background: #1e90ff; }
        .purple { background: #9370db; }
        .orange { background: #ff8c00; }
        .bet-area { width: 100%; background: #111; padding: 15px; border-radius: 10px; border: 1px solid red; display: none; flex-direction: column; align-items: center; }
        .bet-area.active { display: flex; }
        .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin: 10px 0; }
        .bet-btn { padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background: transparent; border: none; color: red; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Баннер -->
        <img src="./banner.png" alt="RB eSports" class="banner">

        <!-- Баланс -->
        <div class="balance-card">
            <span>Баланс:</span>
            <span class="balance-value" id="user-balance">Загрузка...</span> 🪙
        </div>

        <!-- Навигация -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'roulette')">🎡 Рулетка</button>
            <button class="tab-btn" onclick="switchTab(event, 'shop')">🛒 Магазин</button>
        </div>

        <!-- РАЗДЕЛ: РУЛЕТКА -->
        <div id="tab-roulette" class="tab-content active">
            <div class="roulette-window">
                <div id="roulette-display">🎲</div>
            </div>

            <div class="colors-grid" id="colors-grid">
                <button class="color-btn yellow" onclick="selectColor('yellow', 2)">🟨 x2</button>
                <button class="color-btn green" onclick="selectColor('green', 4)">🟩 x4</button>
                <button class="color-btn blue" onclick="selectColor('blue', 6)">🟦 x6</button>
                <button class="color-btn purple" onclick="selectColor('purple', 11)">🟪 x11</button>
                <button class="color-btn orange" onclick="selectColor('orange', 21)">🟧 x21</button>
            </div>

            <div class="bet-area" id="bet-area">
                <p style="margin-bottom:10px;">Ставка на <span id="selected-color-name" style="font-weight:bold; color:yellow;"></span></p>
                <div class="bet-grid">
                    <button class="bet-btn" onclick="spin(10)">10 🪙</button>
                    <button class="bet-btn" onclick="spin(50)">50 🪙</button>
                    <button class="bet-btn" onclick="spin(100)">100 🪙</button>
                    <button class="bet-btn" onclick="spin(500)">500 🪙</button>
                </div>
                <button class="cancel-btn" onclick="cancelBet()">Отмена</button>
            </div>
        </div>

        <!-- РАЗДЕЛ: МАГАЗИН -->
        <div id="tab-shop" class="tab-content">
            <h3>Магазин</h3>
            <p>Скоро здесь будут товары</p>
        </div>

    </div>

    <!-- Логика -->
    <script src="./app.js"></script>
    <script>
        // Встроенная логика на случай, если внешний файл не загрузится
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Берем баланс из ссылки
        const urlParams = new URLSearchParams(window.location.search);
        let currentBalance = parseInt(urlParams.get('balance')) || 0;
        document.getElementById('user-balance').innerText = currentBalance;

        let selectedColor = null;

        function switchTab(event, tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        function selectColor(color, mult) {
            selectedColor = color;
            document.getElementById('colors-grid').style.display = 'none';
            document.getElementById('bet-area').classList.add('active');
            document.getElementById('selected-color-name').innerText = color;
        }

        function cancelBet() {
            document.getElementById('colors-grid').style.display = 'grid';
            document.getElementById('bet-area').classList.remove('active');
        }

        function spin(bet) {
            if (bet > currentBalance) {
                alert("Недостаточно фишек!");
                return;
            }
            // Отправляем данные боту и закрываем окно
            tg.sendData(JSON.stringify({
                action: "spin",
                bet: bet,
                color: selectedColor
            }));
        }
    </script>
</body>
</html>
