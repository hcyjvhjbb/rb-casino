<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RB Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; text-align: center; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .btn { padding: 15px; background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin: 5px; width: 100%; }
        .btn:active { background: #ff0000; }
        .btn-yellow { background: #ffd700; color: #000; }
        .btn-green { background: #32cd32; color: #fff; }
        .btn-blue { background: #1e90ff; color: #fff; }
        .btn-purple { background: #9370db; color: #fff; }
        .btn-orange { background: #ff8c00; color: #fff; }
        .hidden { display: none; }
        
        /* Стили для магазина */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .shop-item { background: #222; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #444;}
        .shop-item img { width: 50px; height: 50px; margin-bottom: 5px; }
        .buy-btn { width: 100%; padding: 10px; background: #ff0000; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>Ваш баланс</h2>
        <h1 id="balance" style="color: #ffcc00;">0</h1>
    </div>

    <div class="box">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn" onclick="showTab('roulette')">🎡 Рулетка</button>
            <button class="btn" onclick="showTab('shop')">🛒 Магазин</button>
        </div>

        <!-- РУЛЕТКА -->
        <div id="tab-roulette">
            <div id="colors" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn btn-yellow" onclick="selectColor('yellow')">🟨 x2</button>
                <button class="btn btn-green" onclick="selectColor('green')">🟩 x4</button>
                <button class="btn btn-blue" onclick="selectColor('blue')">🟦 x6</button>
                <button class="btn btn-purple" onclick="selectColor('purple')">🟪 x11</button>
                <button class="btn btn-orange" onclick="selectColor('orange')">🟧 x21</button>
            </div>

            <div id="bets" class="hidden" style="margin-top: 15px;">
                <p>Ставка на <span id="sel-color" style="color: yellow; font-weight: bold;"></span></p>
                <button class="btn" onclick="spin(10)">10 🪙</button>
                <button class="btn" onclick="spin(50)">50 🪙</button>
                <button class="btn" onclick="spin(100)">100 🪙</button>
                <button class="btn" onclick="spin(500)">500 🪙</button>
                <button class="btn" style="background: transparent; color: red; border: none;" onclick="cancel()">Отмена</button>
            </div>
        </div>

        <!-- МАГАЗИН -->
        <div id="tab-shop" class="hidden">
            <div class="shop-grid">
                <div class="shop-item">
                    <img src="uc_icon.png" onerror="this.src='https://via.placeholder.com/50?text=UC'">
                    <div style="font-weight:bold; color:gold;">60 UC</div>
                    <div style="font-size:12px; color:#aaa;">100 🪙</div>
                    <button class="buy-btn" onclick="buy(60, 100)">Купить</button>
                </div>
                <div class="shop-item">
                    <img src="uc_icon.png" onerror="this.src='https://via.placeholder.com/50?text=UC'">
                    <div style="font-weight:bold; color:gold;">325 UC</div>
                    <div style="font-size:12px; color:#aaa;">500 🪙</div>
                    <button class="buy-btn" onclick="buy(325, 500)">Купить</button>
                </div>
                <div class="shop-item">
                    <img src="uc_icon.png" onerror="this.src='https://via.placeholder.com/50?text=UC'">
                    <div style="font-weight:bold; color:gold;">660 UC</div>
                    <div style="font-size:12px; color:#aaa;">1000 🪙</div>
                    <button class="buy-btn" onclick="buy(660, 1000)">Купить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Получаем баланс и ссылку на бота
        const urlParams = new URLSearchParams(window.location.search);
        let balance = parseInt(urlParams.get('balance')) || 0;
        let botUsername = urlParams.get('bot') || "rbesport_bot"; // Имя вашего бота
        document.getElementById('balance').innerText = balance;

        let currentColor = "";

        function showTab(tab) {
            document.getElementById('tab-roulette').classList.add('hidden');
            document.getElementById('tab-shop').classList.add('hidden');
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }

        function selectColor(color) {
            currentColor = color;
            document.getElementById('colors').classList.add('hidden');
            document.getElementById('bets').classList.remove('hidden');
            document.getElementById('sel-color').innerText = color.toUpperCase();
        }

        function cancel() {
            document.getElementById('colors').classList.remove('hidden');
            document.getElementById('bets').classList.add('hidden');
        }

        function sendAction(actionData) {
            // Если открыто в Telegram, отправляем данные и закрываем окно
            if (tg && tg.initData) {
                tg.sendData(JSON.stringify(actionData));
            } else {
                // Если на ПК (Telegram Desktop), переходим по скрытой ссылке
                window.location.href = `https://t.me/${botUsername}?start=${actionData.action}_${actionData.bet || actionData.uc}_${actionData.color || actionData.price}`;
            }
        }

        function spin(amount) {
            if (amount > balance) {
                alert("❌ Недостаточно фишек!");
                return;
            }
            sendAction({ action: "spin", bet: amount, color: currentColor });
        }

        function buy(uc, price) {
            if (price > balance) {
                alert("❌ Недостаточно фишек!");
                return;
            }
            sendAction({ action: "buy", uc: uc, price: price });
        }
    </script>
</body>
</html>
