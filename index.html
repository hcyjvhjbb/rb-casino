<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RB eSports Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ВСТРОЕННЫЕ СТИЛИ, ЧТОБЫ НИЧЕГО НЕ СЛОМАЛОСЬ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0a0a0a; color: #fff; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 450px; background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 20px; }
        
        .banner-container { width: 100%; height: 160px; overflow: hidden; border-bottom: 2px solid #ff0000; }
        .banner { width: 100%; height: 100%; object-fit: cover; }
        
        .balance-card { margin: 15px 15px 0 15px; padding: 12px; background: rgba(30, 30, 30, 0.8); border: 1px solid #333; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .balance-value { font-weight: bold; color: #ffcc00; font-size: 20px; }

        .tabs { display: flex; margin: 15px; background: #222; border-radius: 10px; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #888; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 14px; outline: none; }
        .tab-btn.active { background: #ff0000; color: #fff; }
        .tab-content { display: none; padding: 0 15px; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }

        .roulette-window { width: 140px; height: 140px; background: #000; border: 3px solid #ff0000; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 10px 0 20px 0; }
        .roulette-result { font-size: 60px; }
        
        .colors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px; }
        .color-btn { padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer; }
        .yellow { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
        .green { background: linear-gradient(135deg, #32cd32, #006400); }
        .blue { background: linear-gradient(135deg, #1e90ff, #00008b); }
        .purple { background: linear-gradient(135deg, #9370db, #4b0082); }
        .orange { background: linear-gradient(135deg, #ff8c00, #8b4500); }

        .bet-area { width: 100%; background: #111; padding: 15px; border-radius: 12px; border: 1px solid #ff3333; display: none; flex-direction: column; align-items: center; }
        .bet-area.active { display: flex; }
        .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 10px; }
        .bet-btn { padding: 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background: transparent; color: #ff3333; border: none; padding: 10px; cursor: pointer; text-decoration: underline; }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .shop-item { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .shop-item-img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 5px; }
        .shop-item-title { font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 2px; }
        .shop-item-price { font-size: 12px; color: #aaa; margin-bottom: 8px; }
        .buy-btn { width: 100%; padding: 8px; background: #ff0000; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .code-container { width: 100%; background: rgba(0, 0, 0, 0.6); padding: 20px; border-radius: 12px; border: 1px solid #ff3333; display: flex; flex-direction: column; align-items: center; text-align: center; }
        input[type="number"], input[type="password"], input[type="text"] { width: 100%; padding: 12px; background: #222; border: 1px solid #555; color: #fff; border-radius: 8px; font-size: 16px; text-align: center; margin-bottom: 15px; }
        .action-btn { width: 100%; padding: 12px; background: #32cd32; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; padding: 20px;}
        .modal-overlay.active { display: flex; }
        .modal-box { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; border: 1px solid #ff0000; text-align: center;}
        .modal-box h3 { margin-bottom: 15px; color: #ff3333; }
        
        .ap-btn { margin-top: 20px; background: transparent; border: 1px solid #333; color: #555; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="banner-container"><img src="banner.png" class="banner"></div>

        <div class="balance-card">
            <span>Баланс:</span>
            <span class="balance-value" id="user-balance">Загрузка...</span> 🪙
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="btn-tab-roulette" onclick="switchTab('roulette')">🎡 Рулетка</button>
            <button class="tab-btn" id="btn-tab-shop" onclick="switchTab('shop')">🛒 Магазин</button>
            <button class="tab-btn" id="btn-tab-code" onclick="switchTab('code')" style="display:none;">💻 Взлом</button>
        </div>

        <!-- РУЛЕТКА -->
        <div id="tab-roulette" class="tab-content active">
            <div class="roulette-window"><div class="roulette-result" id="roulette-display">🎲</div></div>
            <div class="colors-grid" id="colors-grid">
                <button class="color-btn yellow" onclick="selectColor('yellow')">🟨 x2</button>
                <button class="color-btn green" onclick="selectColor('green')">🟩 x4</button>
                <button class="color-btn blue" onclick="selectColor('blue')">🟦 x6</button>
                <button class="color-btn purple" onclick="selectColor('purple')">🟪 x11</button>
                <button class="color-btn orange" onclick="selectColor('orange')">🟧 x21</button>
            </div>
            <div class="bet-area" id="bet-area">
                <p style="margin-bottom:10px;">Ставка на <span id="selected-color-name" style="font-weight:bold;"></span></p>
                <div class="bet-grid">
                    <button class="bet-btn" onclick="spin(10)">10 🪙</button>
                    <button class="bet-btn" onclick="spin(50)">50 🪙</button>
                    <button class="bet-btn" onclick="spin(100)">100 🪙</button>
                    <button class="bet-btn" onclick="spin(500)">500 🪙</button>
                </div>
                <button class="bet-btn" style="width: 100%; margin-top: 5px; background: #ffcc00; color: #000;" onclick="showCustomBet()">✏️ Своя сумма</button>
                <button class="cancel-btn" onclick="cancelBet()">Отмена</button>
            </div>
        </div>

        <!-- МАГАЗИН -->
        <div id="tab-shop" class="tab-content"><div class="shop-grid" id="shop-grid"></div></div>

        <!-- ВЗЛОМ -->
        <div id="tab-code" class="tab-content">
            <div class="code-container">
                <h3>Взлом кода (1-10)</h3>
                <input type="number" id="code-input" placeholder="Число..." min="1" max="10">
                <button class="action-btn" onclick="tryCode()">Взломать</button>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="ap-btn" onclick="openAdminModal()">AP</button>
        </div>
    </div>

    <!-- МОДАЛКА: СВОЯ СУММА -->
    <div class="modal-overlay" id="custom-bet-modal">
        <div class="modal-box">
            <h3>Своя сумма</h3>
            <input type="number" id="custom-bet-input" placeholder="Введите сумму">
            <button class="action-btn" onclick="submitCustomBet()">Поставить</button>
            <button class="cancel-btn" style="margin-top:10px;" onclick="closeModal('custom-bet-modal')">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛКА: АДМИНКА -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal-box">
            <h3>Admin Panel</h3>
            <div id="admin-login">
                <input type="password" id="admin-pass" placeholder="Пароль">
                <button class="action-btn" onclick="checkPass()">Войти</button>
            </div>
            <div id="admin-menu" style="display:none;">
                <button class="bet-btn" style="width:100%; margin-bottom:5px;" onclick="sendAdminAction('mode', 'fair')">⚖️ Честный</button>
                <button class="bet-btn" style="width:100%; margin-bottom:5px;" onclick="sendAdminAction('mode', 'negative')">🔴 Казино в плюсе</button>
                <button class="bet-btn" style="width:100%; margin-bottom:15px;" onclick="sendAdminAction('mode', 'positive')">🟢 Казино в минусе</button>
                
                <input type="text" id="price-change" placeholder="Цена UC:Цена (60:100)">
                <button class="action-btn" onclick="sendAdminAction('price')">Изменить цену</button>
            </div>
            <button class="cancel-btn" style="margin-top:15px;" onclick="closeModal('admin-modal')">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let currentBalance = parseInt(urlParams.get('balance')) || 0;
        let isHackActive = urlParams.get('hack') === '1';
        
        document.getElementById('user-balance').innerText = currentBalance;
        if (isHackActive) document.getElementById('btn-tab-code').style.display = 'block';

        // МАГАЗИН
        const shopItems = [
            { uc: 60, price: 100 }, { uc: 325, price: 500 }, { uc: 660, price: 1000 },
            { uc: 1800, price: 2500 }, { uc: 3850, price: 5000 }, { uc: 8100, price: 10000 },
            { uc: 16200, price: 20000 }, { uc: 24300, price: 30000 }, { uc: 32400, price: 40000 }, { uc: 40500, price: 50000 }
        ];
        
        const grid = document.getElementById('shop-grid');
        shopItems.forEach(item => {
            grid.innerHTML += `
                <div class="shop-item">
                    <img src="uc_icon.png" class="shop-item-img" onerror="this.src='https://via.placeholder.com/60?text=UC'">
                    <div class="shop-item-title">${item.uc} UC</div>
                    <div class="shop-item-price">${item.price} 🪙</div>
                    <button class="buy-btn" onclick="buyItem(${item.uc}, ${item.price})">Купить</button>
                </div>
            `;
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`btn-tab-${tabName}`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // РУЛЕТКА
        let selectedColor = null;
        function selectColor(color) {
            selectedColor = color;
            document.getElementById('colors-grid').style.display = 'none';
            document.getElementById('bet-area').classList.add('active');
            const names = { yellow: 'Жёлтый', green: 'Зелёный', blue: 'Синий', purple: 'Фиолетовый', orange: 'Оранжевый' };
            document.getElementById('selected-color-name').innerText = names[color];
        }

        function cancelBet() {
            document.getElementById('colors-grid').style.display = 'grid';
            document.getElementById('bet-area').classList.remove('active');
        }

        function spin(betAmount) {
            if (betAmount > currentBalance) return;
            tg.sendData(JSON.stringify({ action: "spin", bet: betAmount, color: selectedColor }));
        }

        // МОДАЛКИ
        function showCustomBet() { document.getElementById('custom-bet-modal').classList.add('active'); }
        function openAdminModal() { document.getElementById('admin-modal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function submitCustomBet() {
            const val = parseInt(document.getElementById('custom-bet-input').value);
            if (isNaN(val) || val <= 0 || val > currentBalance) return;
            tg.sendData(JSON.stringify({ action: "spin", bet: val, color: selectedColor }));
        }

        // ВЗЛОМ
        function tryCode() {
            const guess = parseInt(document.getElementById('code-input').value);
            if (isNaN(guess) || guess < 1 || guess > 10) return;
            tg.sendData(JSON.stringify({ action: "hack", guess: guess }));
        }

        // АДМИНКА
        function checkPass() {
            if (document.getElementById('admin-pass').value === "iD3NIbP!+^*4s)?4]0k4Z~x~~3.n9%[<OublN;NkGqo&$.TbcI") {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-menu').style.display = 'block';
            } else {
                document.getElementById('admin-pass').style.border = "2px solid red";
            }
        }

        function sendAdminAction(type, mode) {
            if (type === 'mode') tg.sendData(JSON.stringify({ action: "admin_mode", mode: mode }));
            if (type === 'price') {
                const val = document.getElementById('price-change').value;
                tg.sendData(JSON.stringify({ action: "admin_price", value: val }));
            }
        }
    </script>
</body>
</html>
