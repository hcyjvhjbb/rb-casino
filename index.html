<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RB eSports Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Колесо (вращается) -->
        <div class="wheel-container">
            <div class="wheel-image" id="wheel-img"></div>
            <!-- Указатель сверху -->
            <div class="pointer"></div>
        </div>

        <!-- Верхняя панель (Баланс) -->
        <div class="top-bar">
            <div class="balance-badge">
                Баланс: <span id="user-balance">0</span> 🪙
            </div>
        </div>

        <!-- Нижняя панель управления -->
        <div class="bottom-panel">
            <div class="bet-area hidden" id="bet-area">
                <p>Ставка на <span id="selected-color-name"></span> (x<span id="selected-multiplier"></span>)</p>
                <div class="bet-grid">
                    <button class="bet-btn" onclick="spin(10)">10</button>
                    <button class="bet-btn" onclick="spin(50)">50</button>
                    <button class="bet-btn" onclick="spin(100)">100</button>
                    <button class="bet-btn" onclick="spin(500)">500</button>
                </div>
                <!-- Блок своей суммы -->
                <div class="custom-bet-row">
                    <input type="number" id="custom-bet" placeholder="Своя сумма" min="10">
                    <button class="bet-btn custom-btn" onclick="spinCustom()">Ввести</button>
                </div>
                <button class="cancel-btn" onclick="cancelBet()">Отмена</button>
            </div>

            <div class="colors-panel" id="colors-panel">
                <button class="color-btn yellow" onclick="selectColor('yellow', 2)">x2</button>
                <button class="color-btn green" onclick="selectColor('green', 4)">x4</button>
                <button class="color-btn blue" onclick="selectColor('blue', 6)">x6</button>
                <button class="color-btn purple" onclick="selectColor('purple', 11)">x11</button>
                <button class="color-btn orange" onclick="selectColor('orange', 21)">x21</button>
            </div>
            
            <div class="result-text" id="result-text"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
